name: Charm compatibility
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'
permissions:
  contents: read
concurrency:
  group: charm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: sudo apt-get update && sudo apt-get install -y jq sqlite3
      # Cron runs Charm scripts with Hermes's interpreter, which ships PyYAML; match it here.
      - run: python3 -m pip install pyyaml
      - run: python3 -m unittest discover -s tests -v
      - run: sh agent-hooks/test-linear-intake.sh
      - run: sh -n scripts/local-patches-ensure.sh && sh -n scripts/charm-prestart.sh
      - run: git diff --check
  native:
    name: Native Hermes (${{ matrix.hermes-ref }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        hermes-ref: [f5a9361dcc66b0b972fd488b83129561509b3486, main]
    steps:
      - uses: actions/checkout@v4
        with:
          path: charm
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.hermes-ref }}
          path: hermes
      - uses: astral-sh/setup-uv@v6
      - name: Prepare upstream's locked runtime
        working-directory: hermes
        run: uv sync --frozen --no-default-groups --python 3.14
      - name: Load Charm through native discovery in isolated homes
        run: python3 charm/scripts/runtime_smoke.py "$GITHUB_WORKSPACE/hermes/.venv/bin/hermes"
  patches:
    # Early warning: does the core bundle still apply to upstream main, and do the tests
    # it carries pass there? Exit 2 means a patch needs a hand port before `hermes update`.
    name: Patch bundle on upstream main
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: charm
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: main
          path: hermes
          # Three-way merges need the blobs each artifact was cut against.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Prepare upstream's locked test environment
        working-directory: hermes
        run: uv sync --locked --python 3.14 --extra all --group dev
      - name: Rebase the bundle onto main and run its tests
        run: |
          set -o pipefail
          python3 charm/scripts/patch_series.py rebase --agent hermes --ref HEAD --tests \
            --python "$GITHUB_WORKSPACE/hermes/.venv/bin/python" | tee series.json
      - name: Summarize
        if: always()
        run: |
          [ -s series.json ] || exit 0
          jq -r '"Upstream \(.ref[0:12]): ok=\(.ok)", (.patches[] | "- \(.name): \(.state)"),
                 (if (.regenerated // []) | length > 0 then "Regenerate before updating: \(.regenerated | join(", "))" else empty end)' \
            series.json >> "$GITHUB_STEP_SUMMARY"
