name: charm
version: "0.2.0"
description: Maintained Hermes customizations with explicit per-profile controls
provides_tools: []
capabilities: []
config_schema:
  worker-memory-cap:
    type: bool
    default: true
    description: "Worker resource policy. Override the default 4 GiB worker ceiling within host/cgroup bounds and select a shared worker slice. Requires explicit apply and backend restart."
  cron-worker-bootstrap:
    type: bool
    default: true
    description: "External cron bootstrap. Activate the PM bootstrap before an external cron scheduler starts, so its dependencies load before ownership acknowledgement. Requires explicit apply and backend restart."
  kanban-worktree-teardown:
    type: bool
    default: true
    description: "Independent worktree cleanup. Clean completed, clean, fully pushed worktrees without waiting on children using independent workspaces; retain shared/scratch workspaces while needed. Requires explicit apply and backend restart."
  dashboard-dispatch-caps:
    type: bool
    default: true
    description: "Dashboard dispatch limits. Respect configured total/per-profile in-progress caps, failure limits and default assignee when nudging dashboard dispatch. Requires explicit apply and backend restart."
  project-skills-worktree-trust:
    type: bool
    default: true
    description: "Worktree skill trust. Let registered linked worktrees inherit canonical-repository skill trust after Git metadata validation. Requires explicit apply and backend restart."
  multiplex-notice-profile-scope:
    type: bool
    default: true
    description: "Profile-owned lifecycle notices. Use the owning profile's preferences, language, cron store and delivery adapters for shutdown and interrupted-cron notices. Requires explicit apply and backend restart."
  kanban-merged-review-sync:
    type: bool
    default: true
    description: "Merged review reconciliation. Reuse persisted PR evidence and reconcile unclaimed merged reviews after acceptance checks, without holding board locks across GitHub reads. Requires explicit apply and backend restart."
  idle-compact-watchdog-79357:
    type: bool
    default: true
    description: "Idle compaction timestamp. Preserve pre-watchdog activity time so the idle-compaction check sees the actual idle gap. Requires explicit apply and backend restart."
  kanban-skill-pin-tolerance:
    type: bool
    default: true
    description: "Stale skill-pin tolerance. Drop unavailable assignee skill pins at creation and worker launch, recording creation-time drops and warning at launch. Requires explicit apply and backend restart."
  kanban-token-hygiene:
    type: bool
    default: true
    description: "Compact handoffs and local guidance. Deliver parent attachments and archived-parent handoffs; reduce duplicated output/history; add compact/minimal views, hard-blocker escalation and local read/card-budget guidance. Requires explicit apply and backend restart."
  kanban-branch-name-punctuation:
    type: bool
    default: true
    description: "Valid project branch slugs. Strip boundary periods/hyphens, including after truncation, while retaining internal version-number periods. Requires explicit apply and backend restart."
